# Blink · Quantumult X
# 导入后：在 App 内添加你的订阅。
# 本端没有：MTProto、REJECT-DROP、广告域名集、Apple CDN 域名集、CDN 域名集（Surge 专属）；Tracking、apple_cn、NTP 端口规则、china_ip（没有 QX 格式）。

[general]
server_check_url = http://latency-test.skk.moe/endpoint
network_check_url = http://connectivitycheck.platform.hicloud.com/generate_204
server_check_timeout = 5000
geo_location_checker = disabled

[dns]
no-ipv6
server = 223.5.5.5
server = 119.29.29.29
doh-server = https://dns.alidns.com/dns-query, https://doh.pub/dns-query

[server_remote]
# https://YOUR-SUBSCRIPTION-URL

[policy]
static=Sub, server-tag-regex=.
static=Proxy, HK,TW,JP,US,SG,Final
static=Final, HK,TW,JP,US,SG,Auto,Sub,direct
static=Telegram, HK,TW,JP,US,SG,Final
static=X, HK,TW,JP,US,SG,Final
static=Instagram, HK,TW,JP,US,SG,Final
static=Youtube, HK,TW,JP,US,SG,Final
static=AI, HK,TW,JP,US,Final
static=Google, HK,TW,JP,US,SG,Final
static=GitHub, HK,TW,JP,US,SG,Final
static=Finance, HK,TW,JP,US,SG,Final
static=HK, server-tag-regex=(?i)(香港|🇭🇰|Hong\s*Kong|HongKong|HKG|(?:^|[^A-Za-z])HK(?:G)?(?:[^A-Za-z]|$))
static=TW, server-tag-regex=(?i)(台湾|台灣|臺灣|🇹🇼|台北|臺北|新北|台中|臺中|高雄|Taiwan|Taipei|Kaohsiung|TWN|(?:^|[^A-Za-z])TW(?:N)?(?:[^A-Za-z]|$))
static=JP, server-tag-regex=(?i)(日本|🇯🇵|东京|東京|大阪|Japan|Tokyo|Osaka|Sakura|SoftBank|JPN|(?:^|[^A-Za-z])JP(?:N)?(?:[^A-Za-z]|$))
static=US, server-tag-regex=(?i)(美国|美國|🇺🇸|洛杉矶|洛杉磯|圣何塞|聖荷西|硅谷|矽谷|西雅图|西雅圖|芝加哥|纽约|紐約|United\s*States|Los\s*Angeles|San\s*Jose|Silicon\s*Valley|Seattle|Chicago|New\s*York|USA|US\s*Premium|(?:^|[^A-Za-z])US(?:A)?(?:[^A-Za-z]|$))
static=SG, server-tag-regex=(?i)(新加坡|狮城|獅城|🇸🇬|Singapore|SGP|SGGS|(?:^|[^A-Za-z])SG(?:P)?(?:[^A-Za-z]|$))
url-latency-benchmark=Auto, HK,TW,JP,US,SG, check-interval=600, tolerance=80, alive-checking=false

