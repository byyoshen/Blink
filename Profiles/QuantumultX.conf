# ============================================================
# Blink 配置文件 · Quantumult X
# 导入前在 App 内添加你的订阅节点；地区组通过 server-tag-regex 正则筛选全部节点。
# 策略组与规则引用由 Blink 统一维护；本文件为人工维护层，不随规则每日自动更新。
# 公开模板只保留核心策略组与 App 规则，其余个性化场景请按需自行扩展。
# ADAPTED：App 内添加订阅（未映射自动拉取）；force-policy 覆盖 filter 行尾占位策略。
# UNSUPPORTED：extended-matching / pre-matching / DOMAIN-SET / no-resolve /
#   always-real-ip / always-raw-tcp-hosts / proxy-test-udp / http-api 为 Surge 专属，
#   no-resolve 无生产实证槽位故省略，其余需在 App 内手动配置。
# ============================================================

[general]
server_check_url = http://latency-test.skk.moe/endpoint
network_check_url = http://connectivitycheck.platform.hicloud.com/generate_204
server_check_timeout = 5000
geo_location_checker = disabled

[server_remote]
# ADAPTED：请在 Quantumult X App 内添加下列唯一订阅；地区组通过 server-tag-regex 筛选节点。
# https://YOUR-SUBSCRIPTION-URL

[policy]
static=HK, server-tag-regex=(?i)(香港|🇭🇰|Hong\s*Kong|HongKong|HKG|(?:^|[^A-Za-z])HK(?:G)?(?:[^A-Za-z]|$))
static=TW, server-tag-regex=(?i)(台湾|台灣|🇹🇼|Taiwan|Taipei|TWN|(?:^|[^A-Za-z])TW(?:N)?(?:[^A-Za-z]|$))
static=JP, server-tag-regex=(?i)(日本|🇯🇵|Japan|Tokyo|Osaka|Sakura|SoftBank|JPN|(?:^|[^A-Za-z])JP(?:N)?(?:[^A-Za-z]|$))
static=US, server-tag-regex=(?i)(美国|美國|🇺🇸|United\s*States|America|USA|US\s*Premium|(?:^|[^A-Za-z])US(?:A)?(?:[^A-Za-z]|$))
static=SG, server-tag-regex=(?i)(新加坡|狮城|獅城|🇸🇬|Singapore|SGP|SGGS|(?:^|[^A-Za-z])SG(?:P)?(?:[^A-Za-z]|$))
url-latency-benchmark=Auto, HK,TW,JP,US,SG, check-interval=600, tolerance=80, alive-checking=false
static=Proxy, HK,TW,JP,US,SG,Final
static=Final, HK,TW,JP,US,SG,Auto,direct
static=Telegram, Proxy,Final,direct
static=X, Proxy,Final,direct
static=Youtube, Proxy,Final,direct
static=Instagram, Proxy,Final,direct
static=Google, Proxy,Final,direct
static=Github, Proxy,Final,direct

[filter_remote]
https://raw.githubusercontent.com/Repcz/Tool/X/QuantumultX/Rules/Reject.list, tag=reject, force-policy=reject, update-interval=172800, opt-parser=false, enabled=true
https://raw.githubusercontent.com/Repcz/Tool/X/QuantumultX/Rules/Lan.list, tag=lan, force-policy=direct, update-interval=172800, opt-parser=false, enabled=true
https://raw.githubusercontent.com/Repcz/Tool/X/QuantumultX/Rules/ChinaDomain.list, tag=domestic, force-policy=direct, update-interval=172800, opt-parser=false, enabled=true
https://raw.githubusercontent.com/Repcz/Tool/X/QuantumultX/Rules/CDN.list, tag=cdn, force-policy=Proxy, update-interval=172800, opt-parser=false, enabled=true
https://raw.githubusercontent.com/wendy1a1a/Blink/main/QuantumultX/Telegram-domainset.conf, tag=Telegram-domainset, force-policy=Telegram, update-interval=172800, opt-parser=false, enabled=true
https://raw.githubusercontent.com/wendy1a1a/Blink/main/QuantumultX/Telegram-ip.conf, tag=Telegram-ip, force-policy=Telegram, update-interval=172800, opt-parser=false, enabled=true
https://raw.githubusercontent.com/wendy1a1a/Blink/main/QuantumultX/X-domainset.conf, tag=X-domainset, force-policy=X, update-interval=172800, opt-parser=false, enabled=true
https://raw.githubusercontent.com/wendy1a1a/Blink/main/QuantumultX/X-ip.conf, tag=X-ip, force-policy=X, update-interval=172800, opt-parser=false, enabled=true
https://raw.githubusercontent.com/wendy1a1a/Blink/main/QuantumultX/YouTube-nonip.conf, tag=YouTube-nonip, force-policy=Youtube, update-interval=172800, opt-parser=false, enabled=true
https://raw.githubusercontent.com/wendy1a1a/Blink/main/QuantumultX/Instagram-domainset.conf, tag=Instagram-domainset, force-policy=Instagram, update-interval=172800, opt-parser=false, enabled=true
https://raw.githubusercontent.com/wendy1a1a/Blink/main/QuantumultX/Google-nonip.conf, tag=Google-nonip, force-policy=Google, update-interval=172800, opt-parser=false, enabled=true
https://raw.githubusercontent.com/wendy1a1a/Blink/main/QuantumultX/Google-ip.conf, tag=Google-ip, force-policy=Google, update-interval=172800, opt-parser=false, enabled=true
https://raw.githubusercontent.com/wendy1a1a/Blink/main/QuantumultX/GitHub-domainset.conf, tag=GitHub-domainset, force-policy=Github, update-interval=172800, opt-parser=false, enabled=true
https://raw.githubusercontent.com/Repcz/Tool/X/QuantumultX/Rules/ChinaIP.list, tag=china-ip, force-policy=direct, update-interval=172800, opt-parser=false, enabled=true

[filter_local]
# UNSUPPORTED: reject-drop（Surge pre-matching 专属）本文件省略
# UNSUPPORTED: reject-domainset（Surge DOMAIN-SET 专属）本文件省略
# UNSUPPORTED: tracking（Quantumult X 无对应源）本文件省略
# UNSUPPORTED: ntp-123（当前客户端不支持）本文件省略
# UNSUPPORTED: china-ip2（Quantumult X 无对应源）本文件省略
final, Final
