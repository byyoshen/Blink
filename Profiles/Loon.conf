# ============================================================
# Blink 配置文件 · Loon
# 导入前在 App 内添加你的订阅节点；地区组通过 [Remote Filter] 正则筛选全部节点。
# 策略组与规则引用由 Blink 统一维护；本文件为人工维护层，不随规则每日自动更新。
# 公开模板只保留核心策略组与 App 规则，其余个性化场景请按需自行扩展。
# ADAPTED：App 内添加订阅（未映射自动拉取）。
# UNSUPPORTED：extended-matching / pre-matching / DOMAIN-SET / always-real-ip /
#   always-raw-tcp-hosts / proxy-test-udp / http-api 为 Surge 专属，本文件省略或按需在 App 内配置。
# ============================================================

[General]
ip-mode = ipv4-only
dns-server = 223.5.5.5,119.29.29.29
proxy-test-url = http://latency-test.skk.moe/endpoint
internet-test-url = http://connectivitycheck.platform.hicloud.com/generate_204
test-timeout = 5
disconnect-on-policy-change = true

[Proxy]

[Remote Proxy]
# ADAPTED：请在 Loon App 内添加下列唯一订阅；地区组通过 [Remote Filter] 筛选节点。
# https://YOUR-SUBSCRIPTION-URL

[Remote Filter]
HK = NameRegex, FilterKey = (?i)(香港|🇭🇰|Hong\s*Kong|HongKong|HKG|(?:^|[^A-Za-z])HK(?:G)?(?:[^A-Za-z]|$))
TW = NameRegex, FilterKey = (?i)(台湾|台灣|🇹🇼|Taiwan|Taipei|TWN|(?:^|[^A-Za-z])TW(?:N)?(?:[^A-Za-z]|$))
JP = NameRegex, FilterKey = (?i)(日本|🇯🇵|Japan|Tokyo|Osaka|Sakura|SoftBank|JPN|(?:^|[^A-Za-z])JP(?:N)?(?:[^A-Za-z]|$))
US = NameRegex, FilterKey = (?i)(美国|美國|🇺🇸|United\s*States|America|USA|US\s*Premium|(?:^|[^A-Za-z])US(?:A)?(?:[^A-Za-z]|$))
SG = NameRegex, FilterKey = (?i)(新加坡|狮城|獅城|🇸🇬|Singapore|SGP|SGGS|(?:^|[^A-Za-z])SG(?:P)?(?:[^A-Za-z]|$))

[Proxy Group]
Auto = url-test, HK,TW,JP,US,SG, interval=600, tolerance=80
Proxy = select, HK,TW,JP,US,SG,Final
Final = select, HK,TW,JP,US,SG,Auto,DIRECT
Telegram = select, Proxy,Final,DIRECT
X = select, Proxy,Final,DIRECT
Youtube = select, Proxy,Final,DIRECT
Instagram = select, Proxy,Final,DIRECT
Google = select, Proxy,Final,DIRECT
Github = select, Proxy,Final,DIRECT

[Rule]
DEST-PORT,123,DIRECT
FINAL,Final

[Remote Rule]
https://ruleset.skk.moe/List/non_ip/reject.conf, policy = REJECT, tag = reject, enabled = true
https://raw.githubusercontent.com/ConnersHua/RuleGo/master/Surge/Ruleset/Extra/Reject/Tracking.list, policy = REJECT, tag = tracking, enabled = true
https://ruleset.skk.moe/List/non_ip/lan.conf, policy = DIRECT, tag = lan, enabled = true
https://ruleset.skk.moe/List/non_ip/domestic.conf, policy = DIRECT, tag = domestic, enabled = true
https://ruleset.skk.moe/List/non_ip/cdn.conf, policy = Proxy, tag = cdn, enabled = true
# UNSUPPORTED: reject-drop（Surge pre-matching 专属）本文件省略
# UNSUPPORTED: reject-domainset（Surge DOMAIN-SET 专属）本文件省略
https://raw.githubusercontent.com/byyoshen/Blink/main/Loon/Telegram-domainset.conf, policy = Telegram, tag = Telegram-domainset, enabled = true
https://raw.githubusercontent.com/byyoshen/Blink/main/Loon/Telegram-ip.conf, policy = Telegram, tag = Telegram-ip, enabled = true
https://raw.githubusercontent.com/byyoshen/Blink/main/Loon/X-domainset.conf, policy = X, tag = X-domainset, enabled = true
https://raw.githubusercontent.com/byyoshen/Blink/main/Loon/X-ip.conf, policy = X, tag = X-ip, enabled = true
https://raw.githubusercontent.com/byyoshen/Blink/main/Loon/YouTube-nonip.conf, policy = Youtube, tag = YouTube-nonip, enabled = true
https://raw.githubusercontent.com/byyoshen/Blink/main/Loon/Instagram-domainset.conf, policy = Instagram, tag = Instagram-domainset, enabled = true
https://raw.githubusercontent.com/byyoshen/Blink/main/Loon/Google-nonip.conf, policy = Google, tag = Google-nonip, enabled = true
https://raw.githubusercontent.com/byyoshen/Blink/main/Loon/Google-ip.conf, policy = Google, tag = Google-ip, enabled = true
https://raw.githubusercontent.com/byyoshen/Blink/main/Loon/GitHub-domainset.conf, policy = Github, tag = GitHub-domainset, enabled = true
https://ruleset.skk.moe/List/ip/domestic.conf, policy = DIRECT, tag = china-ip, enabled = true
https://ruleset.skk.moe/List/ip/china_ip.conf, policy = DIRECT, tag = china-ip2, enabled = true

[Host]
