# ============================================================
# Blink 配置文件 · Egern
# 单订阅池（Sub）：导入前把 https://YOUR-SUBSCRIPTION-URL 替换为你的订阅链接。
# 策略组与规则引用由 Blink 统一维护；本文件为人工维护层，不随规则每日自动更新。
# 公开模板只保留核心策略组与 App 规则，其余个性化场景请按需自行扩展。
# ADAPTED：url-test 无生产实证暂以 select 呈现；no-resolve 为 rule-set 级。
# UNSUPPORTED：extended-matching / pre-matching / DOMAIN-SET / always-real-ip /
#   always-raw-tcp-hosts / proxy-test-udp / http-api 为 Surge 专属，本文件省略或需在 App 内配置。
# ============================================================

ipv6: false
hijack_dns:
- '*:53'
geoip_db_url: https://raw.githubusercontent.com/Masaiki/GeoIP2-CN/release/Country.mmdb

dns:
  bootstrap:
  - 223.5.5.5
  - 119.29.29.29
  upstreams:
    China:
    - https://doh.pub/dns-query
    Global:
    - https://1.1.1.1/dns-query
  proxy_nameservers:
  - https://1.1.1.1/dns-query

policy_groups:
- external:
    name: Sub
    type: select
    urls:
    - https://YOUR-SUBSCRIPTION-URL
    update_interval: 86400
    hidden: false
- select:
    name: HK
    policies:
    - Sub
    flatten: true
    filter: '(?i)(香港|🇭🇰|Hong\s*Kong|HongKong|HKG|(?:^|[^A-Za-z])HK(?:G)?(?:[^A-Za-z]|$))'
- select:
    name: TW
    policies:
    - Sub
    flatten: true
    filter: '(?i)(台湾|台灣|🇹🇼|Taiwan|Taipei|TWN|(?:^|[^A-Za-z])TW(?:N)?(?:[^A-Za-z]|$))'
- select:
    name: JP
    policies:
    - Sub
    flatten: true
    filter: '(?i)(日本|🇯🇵|Japan|Tokyo|Osaka|Sakura|SoftBank|JPN|(?:^|[^A-Za-z])JP(?:N)?(?:[^A-Za-z]|$))'
- select:
    name: US
    policies:
    - Sub
    flatten: true
    filter: '(?i)(美国|美國|🇺🇸|United\s*States|America|USA|US\s*Premium|(?:^|[^A-Za-z])US(?:A)?(?:[^A-Za-z]|$))'
- select:
    name: SG
    policies:
    - Sub
    flatten: true
    filter: '(?i)(新加坡|狮城|獅城|🇸🇬|Singapore|SGP|SGGS|(?:^|[^A-Za-z])SG(?:P)?(?:[^A-Za-z]|$))'
- select:
    name: Auto
    policies:
    - HK
    - TW
    - JP
    - US
    - SG
    # ADAPTED：Egern url-test 待真机验证（Needs Verification），暂以 select 呈现
- select:
    name: Proxy
    policies:
    - HK
    - TW
    - JP
    - US
    - SG
    - Final
- select:
    name: Final
    policies:
    - HK
    - TW
    - JP
    - US
    - SG
    - Auto
    - Sub
    - DIRECT
- select:
    name: Telegram
    policies:
    - Proxy
    - Final
    - DIRECT
- select:
    name: X
    policies:
    - Proxy
    - Final
    - DIRECT
- select:
    name: Youtube
    policies:
    - Proxy
    - Final
    - DIRECT
- select:
    name: Instagram
    policies:
    - Proxy
    - Final
    - DIRECT
- select:
    name: Google
    policies:
    - Proxy
    - Final
    - DIRECT
- select:
    name: Github
    policies:
    - Proxy
    - Final
    - DIRECT

rules:
- rule_set:
    match: https://ruleset.skk.moe/List/non_ip/reject.conf
    policy: REJECT
- rule_set:
    match: https://raw.githubusercontent.com/ConnersHua/RuleGo/master/Surge/Ruleset/Extra/Reject/Tracking.list
    policy: REJECT
- rule_set:
    match: https://ruleset.skk.moe/List/non_ip/lan.conf
    policy: DIRECT
- rule_set:
    match: https://ruleset.skk.moe/List/non_ip/domestic.conf
    policy: DIRECT
- rule_set:
    match: https://ruleset.skk.moe/List/non_ip/cdn.conf
    policy: Proxy
# UNSUPPORTED: reject-drop（Surge pre-matching 专属）本文件省略
# UNSUPPORTED: reject-domainset（Surge DOMAIN-SET 专属）本文件省略
# UNSUPPORTED: ntp-123（当前客户端不支持）本文件省略
- rule_set:
    match: https://raw.githubusercontent.com/wendy1a1a/Blink/main/Egern/Telegram-domainset.conf
    policy: Telegram
- rule_set:
    match: https://raw.githubusercontent.com/wendy1a1a/Blink/main/Egern/Telegram-ip.conf
    policy: Telegram
- rule_set:
    match: https://raw.githubusercontent.com/wendy1a1a/Blink/main/Egern/X-domainset.conf
    policy: X
- rule_set:
    match: https://raw.githubusercontent.com/wendy1a1a/Blink/main/Egern/X-ip.conf
    policy: X
- rule_set:
    match: https://raw.githubusercontent.com/wendy1a1a/Blink/main/Egern/YouTube-nonip.conf
    policy: Youtube
- rule_set:
    match: https://raw.githubusercontent.com/wendy1a1a/Blink/main/Egern/Instagram-domainset.conf
    policy: Instagram
- rule_set:
    match: https://raw.githubusercontent.com/wendy1a1a/Blink/main/Egern/Google-nonip.conf
    policy: Google
- rule_set:
    match: https://raw.githubusercontent.com/wendy1a1a/Blink/main/Egern/Google-ip.conf
    policy: Google
- rule_set:
    match: https://raw.githubusercontent.com/wendy1a1a/Blink/main/Egern/GitHub-domainset.conf
    policy: Github
- rule_set:
    match: https://ruleset.skk.moe/List/ip/domestic.conf
    policy: DIRECT
- rule_set:
    match: https://ruleset.skk.moe/List/ip/china_ip.conf
    policy: DIRECT
- default:
    policy: Final
