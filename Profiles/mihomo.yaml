rules:
  - DOMAIN,app-site-association.cdn-apple.com,REJECT
  - RULE-SET,reject,REJECT
  - RULE-SET,tracking,REJECT
  - DST-PORT,123,DIRECT
  - RULE-SET,apple_music,DIRECT
  - RULE-SET,apple_cn,DIRECT
  - DOMAIN-SUFFIX,ls.apple.com,DIRECT
  - RULE-SET,apple,DIRECT
  - RULE-SET,wechat,DIRECT
  # UNSUPPORTED: reject-drop（Surge pre-matching 专属）本文件省略
  # UNSUPPORTED: reject-domainset（Surge DOMAIN-SET 专属）本文件省略
  # UNSUPPORTED: apple-cdn（Surge DOMAIN-SET 专属）本文件省略
  - RULE-SET,DouYin_domainset,DIRECT
  - RULE-SET,YouTube_nonip,Youtube
  - RULE-SET,X_domainset,Daily
  - RULE-SET,Instagram_domainset,Daily
  - RULE-SET,Threads_domainset,Daily
  # UNSUPPORTED: Telegram PROTOCOL,MTProto（Surge PROTOCOL 规则专属）本文件省略
  - RULE-SET,Telegram_domainset,Telegram
  - RULE-SET,Netflix_nonip,JP
  - RULE-SET,TikTok_nonip,JP
  - RULE-SET,Spotify_nonip,HK
  - RULE-SET,Steam_domainset,Proxy
  - RULE-SET,AI_nonip,AI
  - RULE-SET,OKX_domainset,Finance
  - RULE-SET,PayPal_nonip,Finance
  - RULE-SET,WhatsApp_domainset,Proxy
  - RULE-SET,LINE_domainset,Proxy
  - RULE-SET,GitHub_domainset,GitHub
  - RULE-SET,Google_nonip,Google
  - RULE-SET,domestic,DIRECT
  - RULE-SET,cdn,Proxy
  # UNSUPPORTED: cdn-domainset（Surge DOMAIN-SET 专属）本文件省略
  - RULE-SET,X_ip,Daily,no-resolve
  - RULE-SET,Telegram_ip,Telegram,no-resolve
  - RULE-SET,Netflix_ip,JP,no-resolve
  - RULE-SET,Spotify_ip,HK,no-resolve
  - RULE-SET,Google_ip,Google,no-resolve
  - RULE-SET,china_ip,DIRECT,no-resolve
  - RULE-SET,lan_ip,DIRECT,no-resolve
  - RULE-SET,china_ip2,DIRECT,no-resolve
