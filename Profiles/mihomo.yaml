# ============================================================
# Blink 配置文件 · mihomo 内核（Clash Meta for Android / FLClash 通用）
# 单订阅池（Sub）：导入前把 https://YOUR-SUBSCRIPTION-URL 替换为你的订阅链接。
# 策略组与规则引用由 Blink 统一维护；本文件为人工维护层，不随规则每日自动更新。
# 目标客户端：Clash Meta for Android / FLClash（Mihomo 内核，完整兼容）。
# CFA（Clash Premium 内核，已停更）部分兼容：不支持 format / mrs / size-limit
# 等 Meta 扩展字段，导入时可能被忽略。
# Blink 规则经 mihomo/ 目录分发：classical 已显式去除 USER-AGENT（内核无此类型），
# 构建报告计数，绝不让内核静默跳过。
# ADAPTED：always-real-ip / always-raw-tcp-hosts / proxy-test-udp / http-api 为 Surge 专属，
#   本文件用 fake-ip + IP rule 兜底。
# UNSUPPORTED：extended-matching / pre-matching / DOMAIN-SET 为 Surge 专属，本文件省略。
# UNSUPPORTED：hijack-dns 属于 tun.dns-hijack，本模板不开 tun；skip-proxy 无对应键；
#   internet-test-url 无对应键，代理测试地址写在订阅 health-check 与 url-test 组里。
# UNSUPPORTED：MITM —— mihomo 主线没有 MITM 配置项，本文件不写。
# ============================================================

mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
unified-delay: true
keep-alive-interval: 15
ipv6: false

dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  fake-ip-filter:
    - '+.lan'
    - '+.local'
    - '+.direct'

proxy-providers:
  Sub:
    type: http
    url: https://YOUR-SUBSCRIPTION-URL
    interval: 86400
    health-check:
      enable: true
      url: http://latency-test.skk.moe/endpoint
      interval: 300
      timeout: 5000

proxy-groups:
  - {name: Sub, type: select, use: [Sub]}
  - {name: Proxy, type: select, proxies: [HK,TW,JP,US,SG,Final]}
  - {name: Final, type: select, proxies: [HK,TW,JP,US,SG,Auto,Sub,DIRECT]}
  - {name: Telegram, type: select, proxies: [HK,TW,JP,US,SG,Final]}
  - {name: Daily, type: select, proxies: [HK,TW,JP,US,SG,Final]}
  - {name: Youtube, type: select, proxies: [HK,TW,JP,US,SG,Final]}
  - {name: AI, type: select, proxies: [HK,TW,JP,US,Final]}
  - {name: Google, type: select, proxies: [HK,TW,JP,US,SG,Final]}
  - {name: GitHub, type: select, proxies: [HK,TW,JP,US,SG,Final]}
  - {name: Finance, type: select, proxies: [HK,TW,JP,US,SG,Final]}
  - {name: HK, type: select, use: [Sub], filter: '(?i)(香港|🇭🇰|Hong\s*Kong|HongKong|HKG|(?:^|[^A-Za-z])HK(?:G)?(?:[^A-Za-z]|$))', include-all: true}
  - {name: TW, type: select, use: [Sub], filter: '(?i)(台湾|台灣|臺灣|🇹🇼|台北|臺北|新北|台中|臺中|高雄|Taiwan|Taipei|Kaohsiung|TWN|(?:^|[^A-Za-z])TW(?:N)?(?:[^A-Za-z]|$))', include-all: true}
  - {name: JP, type: select, use: [Sub], filter: '(?i)(日本|🇯🇵|东京|東京|大阪|Japan|Tokyo|Osaka|Sakura|SoftBank|JPN|(?:^|[^A-Za-z])JP(?:N)?(?:[^A-Za-z]|$))', include-all: true}
  - {name: US, type: select, use: [Sub], filter: '(?i)(美国|美國|🇺🇸|洛杉矶|洛杉磯|圣何塞|聖荷西|硅谷|矽谷|西雅图|西雅圖|芝加哥|纽约|紐約|United\s*States|Los\s*Angeles|San\s*Jose|Silicon\s*Valley|Seattle|Chicago|New\s*York|USA|US\s*Premium|(?:^|[^A-Za-z])US(?:A)?(?:[^A-Za-z]|$))', include-all: true}
  - {name: SG, type: select, use: [Sub], filter: '(?i)(新加坡|狮城|獅城|🇸🇬|Singapore|SGP|SGGS|(?:^|[^A-Za-z])SG(?:P)?(?:[^A-Za-z]|$))', include-all: true}
  - {name: Auto, type: url-test, proxies: [HK,TW,JP,US,SG], url: http://latency-test.skk.moe/endpoint, interval: 600, tolerance: 80}

