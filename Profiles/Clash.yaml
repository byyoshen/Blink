# ============================================================
# Blink 配置文件 · Clash（Mihomo 内核 / Android 通用）
# 单订阅池（Sub）：导入前把 https://YOUR-SUBSCRIPTION-URL 替换为你的订阅链接。
# 策略组与规则引用由 Blink 统一维护；本文件为人工维护层，不随规则每日自动更新。
# 目标客户端：Clash Meta for Android / FLClash（Mihomo 内核，完整兼容）。
# CFA（Clash Premium 内核，已停更）部分兼容：不支持 format / mrs / size-limit
# 等 Meta 扩展字段，导入时可能被忽略。
# Blink 规则经 Clash/ 目录分发：classical 已显式去除 USER-AGENT（内核无此类型），
# 构建报告计数，绝不让内核静默跳过。
# ADAPTED：always-real-ip / always-raw-tcp-hosts / proxy-test-udp / http-api 为 Surge 专属，
#   本文件用 fake-ip + IP rule 兜底。
# UNSUPPORTED：extended-matching / pre-matching / DOMAIN-SET 为 Surge 专属，本文件省略。
# ============================================================

mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
ipv6: false
unified-delay: true
keep-alive-interval: 15

dns:
  enable: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  nameserver:
    - 223.5.5.5
    - 119.29.29.29

proxy-providers:
  Sub:
    type: http
    url: https://YOUR-SUBSCRIPTION-URL
    interval: 86400
    health-check:
      enable: true
      url: http://www.gstatic.com/generate_204
      interval: 300
      timeout: 5000

proxy-groups:
  - {name: HK, type: select, use: [Sub], filter: '(?i)(香港|🇭🇰|Hong\s*Kong|HongKong|HKG|(?:^|[^A-Za-z])HK(?:G)?(?:[^A-Za-z]|$))', include-all: true}
  - {name: TW, type: select, use: [Sub], filter: '(?i)(台湾|台灣|🇹🇼|Taiwan|Taipei|TWN|(?:^|[^A-Za-z])TW(?:N)?(?:[^A-Za-z]|$))', include-all: true}
  - {name: JP, type: select, use: [Sub], filter: '(?i)(日本|🇯🇵|Japan|Tokyo|Osaka|Sakura|SoftBank|JPN|(?:^|[^A-Za-z])JP(?:N)?(?:[^A-Za-z]|$))', include-all: true}
  - {name: US, type: select, use: [Sub], filter: '(?i)(美国|美國|🇺🇸|United\s*States|America|USA|US\s*Premium|(?:^|[^A-Za-z])US(?:A)?(?:[^A-Za-z]|$))', include-all: true}
  - {name: SG, type: select, use: [Sub], filter: '(?i)(新加坡|狮城|獅城|🇸🇬|Singapore|SGP|SGGS|(?:^|[^A-Za-z])SG(?:P)?(?:[^A-Za-z]|$))', include-all: true}
  - {name: Auto, type: url-test, proxies: [HK,TW,JP,US,SG], url: http://cp.cloudflare.com/generate_204, interval: 600, tolerance: 80}
  - {name: Proxy, type: select, proxies: [HK,TW,JP,US,SG,Final]}
  - {name: Final, type: select, proxies: [HK,TW,JP,US,SG,Auto,DIRECT]}
  - {name: Telegram, type: select, proxies: [Proxy,Final,DIRECT]}
  - {name: X, type: select, proxies: [Proxy,Final,DIRECT]}
  - {name: Youtube, type: select, proxies: [Proxy,Final,DIRECT]}
  - {name: Instagram, type: select, proxies: [Proxy,Final,DIRECT]}
  - {name: Google, type: select, proxies: [Proxy,Final,DIRECT]}
  - {name: Github, type: select, proxies: [Proxy,Final,DIRECT]}

rule-providers:
  reject:
    type: http
    behavior: classical
    format: text
    url: https://ruleset.skk.moe/List/non_ip/reject.conf
    interval: 86400
  tracking:
    type: http
    behavior: classical
    format: text
    url: https://raw.githubusercontent.com/ConnersHua/RuleGo/master/Surge/Ruleset/Extra/Reject/Tracking.list
    interval: 86400
  lan:
    type: http
    behavior: classical
    format: text
    url: https://ruleset.skk.moe/List/non_ip/lan.conf
    interval: 86400
  domestic:
    type: http
    behavior: classical
    format: text
    url: https://ruleset.skk.moe/List/non_ip/domestic.conf
    interval: 86400
  cdn:
    type: http
    behavior: classical
    format: text
    url: https://ruleset.skk.moe/List/non_ip/cdn.conf
    interval: 86400
  Telegram_domainset:
    type: http
    behavior: domain
    format: text
    url: https://raw.githubusercontent.com/byyoshen/Blink/main/Clash/Telegram-domainset.conf
    interval: 86400
  Telegram_ip:
    type: http
    behavior: classical
    format: text
    url: https://raw.githubusercontent.com/byyoshen/Blink/main/Clash/Telegram-ip.conf
    interval: 86400
  X_domainset:
    type: http
    behavior: domain
    format: text
    url: https://raw.githubusercontent.com/byyoshen/Blink/main/Clash/X-domainset.conf
    interval: 86400
  X_ip:
    type: http
    behavior: classical
    format: text
    url: https://raw.githubusercontent.com/byyoshen/Blink/main/Clash/X-ip.conf
    interval: 86400
  YouTube_nonip:
    type: http
    behavior: classical
    format: text
    url: https://raw.githubusercontent.com/byyoshen/Blink/main/Clash/YouTube-nonip.conf
    interval: 86400
  Instagram_domainset:
    type: http
    behavior: domain
    format: text
    url: https://raw.githubusercontent.com/byyoshen/Blink/main/Clash/Instagram-domainset.conf
    interval: 86400
  Google_nonip:
    type: http
    behavior: classical
    format: text
    url: https://raw.githubusercontent.com/byyoshen/Blink/main/Clash/Google-nonip.conf
    interval: 86400
  Google_ip:
    type: http
    behavior: classical
    format: text
    url: https://raw.githubusercontent.com/byyoshen/Blink/main/Clash/Google-ip.conf
    interval: 86400
  GitHub_domainset:
    type: http
    behavior: domain
    format: text
    url: https://raw.githubusercontent.com/byyoshen/Blink/main/Clash/GitHub-domainset.conf
    interval: 86400
  china_ip:
    type: http
    behavior: classical
    format: text
    url: https://ruleset.skk.moe/List/ip/domestic.conf
    interval: 86400
  china_ip2:
    type: http
    behavior: classical
    format: text
    url: https://ruleset.skk.moe/List/ip/china_ip.conf
    interval: 86400

rules:
  - RULE-SET,reject,REJECT
  - RULE-SET,tracking,REJECT
  - RULE-SET,lan,DIRECT
  - RULE-SET,domestic,DIRECT
  - RULE-SET,cdn,Proxy
  # UNSUPPORTED: reject-drop（Surge pre-matching 专属）本文件省略
  # UNSUPPORTED: reject-domainset（Surge DOMAIN-SET 专属）本文件省略
  - RULE-SET,Telegram_domainset,Telegram
  - RULE-SET,Telegram_ip,Telegram
  - RULE-SET,X_domainset,X
  - RULE-SET,X_ip,X
  - RULE-SET,YouTube_nonip,Youtube
  - RULE-SET,Instagram_domainset,Instagram
  - RULE-SET,Google_nonip,Google
  - RULE-SET,Google_ip,Google
  - RULE-SET,GitHub_domainset,Github
  - RULE-SET,china_ip,DIRECT,no-resolve
  - RULE-SET,china_ip2,DIRECT,no-resolve
  - DST-PORT,123,DIRECT
  - MATCH,Final
