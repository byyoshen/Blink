name: Update Rule-Sets

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions cron uses UTC. This is 00:01 in China Standard Time (UTC+8).
    - cron: "1 16 * * *"

permissions:
  contents: write

concurrency:
  group: update-rule-sets
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the repository
        uses: actions/checkout@v6
        with:
          persist-credentials: true

      - name: Validate referenced paths exist
        shell: bash
        run: |
          missing=0
          while read -r p; do
            if [ "$p" = "engine/reports/build_report.json" ]; then
              echo "runtime output: $p"
              continue
            fi
            if [ ! -e "$p" ]; then
              echo "::error::Path referenced in update.yml does not exist at checkout: $p"
              missing=1
            else
              echo "ok: $p"
            fi
          done < <(grep -oE 'engine/[A-Za-z0-9_./-]+' .github/workflows/update.yml | sort -u)
          exit $missing

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/requirements.txt

      - name: Install the pinned dependency
        run: python -m pip install --disable-pip-version-check --requirement engine/requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s engine/tests -v

      - name: Build all enabled Rule-Sets
        shell: bash
        run: |
          set -o pipefail
          python engine/scripts/build.py --write | tee engine/reports/build_report.json

      - name: Verify generated Rule-Sets and provenance
        run: |
          python engine/scripts/parity_check.py --root .
          python engine/scripts/health_check.py --root .
          python engine/scripts/validate_views.py --root .
          python engine/scripts/overlap_check.py --root .
          python engine/scripts/verify_manifest.py --root .
          python engine/scripts/verify_profiles.py --root .

      - name: Refresh portal data
        run: python engine/scripts/gen_portal_stats.py

      - name: Scan final repository state for sensitive patterns
        run: python engine/scripts/secret_scan.py --root .

      - name: Upload build report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: build-report
          path: engine/reports/build_report.json
          if-no-files-found: warn
          retention-days: 14

      - name: Detect generated changes
        id: generated
        shell: bash
        run: |
          if [ -n "$(git status --porcelain -- Surge Loon Shadowrocket Stash mihomo Egern QuantumultX engine/portal/public/data manifest.json)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit updated Rule-Sets
        if: steps.generated.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- Surge Loon Shadowrocket Stash mihomo Egern QuantumultX engine/portal/public/data manifest.json
          git commit -m "chore: update generated rule-sets and portal data · $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          # Never rebase after validation. A concurrent main update must make
          # this push fail so the next run rebuilds and revalidates from HEAD.
          git push
