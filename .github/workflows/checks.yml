name: Checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            engine/requirements.txt
            engine/requirements-dev.txt
      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check --requirement engine/requirements.txt --requirement engine/requirements-dev.txt
      - name: Run unit and regression tests
        run: python -m unittest discover -s engine/tests -v
      - name: Verify seven-client parity
        run: python engine/scripts/parity_check.py --root . --strict
      - name: Verify generated output health
        run: python engine/scripts/health_check.py --root .
      - name: Verify semantic multi-view invariants
        run: python engine/scripts/validate_views.py --root .
      - name: Verify cross-App overlap baseline
        run: python engine/scripts/overlap_check.py --root .
      - name: Verify provenance and artifact checksums
        run: python engine/scripts/verify_manifest.py --root .
      - name: Verify portal data matches the generated outputs
        # update.yml regenerates stats.json on every daily build, but a local
        # `build.py --app <App> --write` can change rule counts without it.
        # Without this gate the portal silently serves stale counts.
        run: python engine/scripts/gen_portal_stats.py --check
      - name: Verify generated Profiles and local references
        run: python engine/scripts/verify_profiles.py --root .
      - name: Scan sensitive patterns
        run: python engine/scripts/secret_scan.py --root .

  golden-byte:
    # AGENTS.md 核心不变量：Surge / Loon / Shadowrocket / Stash 四个
    # classical 目录必须逐字节相同。任何 push 都自动断言，防止
    # 生成产物被手工改散或渲染器出现隐性分叉。
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6
      - name: Assert four classical dirs are byte-identical (main .list outputs)
        shell: bash
        run: |
          set -euo pipefail
          # Only the main *.list outputs must stay byte-identical across
          # Surge / Loon / Shadowrocket / Stash. The *.conf files are the
          # per-client semantic views (domainset / nonip / ip), intentionally
          # serialized differently per client, and are validated separately by
          # engine/scripts/validate_views.py.
          for d in Loon Shadowrocket Stash; do
            mismatch=0
            for f in Surge/*.list; do
              base="$(basename "$f")"
              if ! diff -q "$f" "$d/$base" > /dev/null; then
                echo "::error::$d/$base differs from Surge/$base — classical dirs must stay byte-identical"
                diff -u "$f" "$d/$base" | head -50
                mismatch=1
              fi
            done
            if [ "$mismatch" = "1" ]; then exit 1; fi
            echo "ok: Surge == $d (main .list outputs)"
          done
      - name: Assert Clash equals Surge minus USER-AGENT
        shell: bash
        run: |
          set -euo pipefail
          for f in Clash/*.list; do
            base="$(basename "$f")"
            if ! diff <(grep -v '^#' "Surge/$base" | grep -v '^USER-AGENT,') <(grep -v '^#' "$f") > /dev/null; then
              echo "::error::$f is not Surge/$base minus USER-AGENT lines"
              exit 1
            fi
          done
          echo "ok: Clash == Surge minus USER-AGENT"

  lint-python:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install ruff
        run: python -m pip install --disable-pip-version-check --requirement engine/requirements-dev.txt
      - name: ruff check
        run: ruff check engine/
      - name: ruff format check
        run: ruff format --check engine/

  lint-portal:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine/portal
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: engine/portal/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Prettier check
        run: npx prettier --check "src/**/*.{ts,tsx}"
      - name: Typecheck
        run: npx tsc --noEmit
