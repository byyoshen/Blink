name: Deploy portal to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "engine/portal/**"
      - ".github/workflows/pages.yml"
  # The daily update commits engine/portal/public/data/stats.json with the
  # default GITHUB_TOKEN, and a push made with that token does not trigger
  # other workflows. Without this trigger the portal keeps serving the rule
  # counts from the last human portal commit.
  workflow_run:
    workflows: ["Update Rule-Sets"]
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # workflow_run fires on every completion, including failures; only a
    # successful daily update produces data worth deploying. Other triggers
    # carry no workflow_run context, so they always pass this guard.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: engine/portal/package-lock.json

      - name: Install dependencies
        working-directory: engine/portal
        run: npm ci

      - name: Build the portal
        working-directory: engine/portal
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: engine/portal/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
