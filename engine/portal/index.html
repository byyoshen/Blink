<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta

      content="经审计的上游规则渲染为七客户端规则集与配置文件：Surge / Shadowrocket / Loon / Stash / Clash / Egern / Quantumult X；规则每日自动更新，配置人工维护、真机验证后发布。"

    />
    <link rel="icon" href="favicon-cat.png" type="image/png" />
    <script>
      (function () {
        // Default dark theme; keep the user's manual choice if stored.
        try {
          if (localStorage.getItem("blink-theme") !== "light") {
            document.documentElement.classList.add("dark");
          }
        } catch (e) {}
      })();
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
