# Primary source is selected per application.
# Source preference is SukkaW > Repcz > proven maintainers > v2fly/MetaCubeX,
# but evidence overrides preference.
# supplement is optional and only contains verified upstream gaps.
# Generated Surge files must never be manually edited.

version: 1

apps:
  OKX:
    enabled: true
    output: Surge/OKX.list
    views: true
    sources:
      - name: v2fly-domain-list-community
        author: v2fly
        role: primary
        format: v2fly-domain-list
        url: https://raw.githubusercontent.com/v2fly/domain-list-community/master/data/okx
    include_policy:
      mode: explicit
      allow: []
      deny: []
    attributes:
      mode: explicit
      include: []
    supplement: engine/sources/supplement/OKX.list
    exclude: []
    note: >-
      Repcz/SukkaW currently have no preferred maintained dedicated OKX source.
      v2fly is used because its current OKX dataset is materially more complete
      and actively maintained than the old blackmatrix7 Surge list.

  WhatsApp:
    enabled: true
    output: Surge/WhatsApp.list
    views: true
    sources:
      - name: v2fly-domain-list-community
        author: v2fly
        role: primary
        format: v2fly-domain-list
        url: https://raw.githubusercontent.com/v2fly/domain-list-community/master/data/whatsapp
    include_policy:
      mode: explicit
      allow: []
      deny: []
    attributes:
      mode: explicit
      include: []
    supplement: engine/sources/supplement/WhatsApp.list
    exclude: []
    note: >-
      v2fly is preferred over the older blackmatrix7 list because its current
      WhatsApp domain coverage is more modern and avoids relying on stale IP
      ranges or overly broad shared Meta endpoints.

  LINE:
    enabled: true
    output: Surge/LINE.list
    views: true
    sources:
      - name: v2fly-domain-list-community
        author: v2fly
        role: primary
        format: v2fly-domain-list
        url: https://raw.githubusercontent.com/v2fly/domain-list-community/master/data/line
    include_policy:
      mode: explicit
      allow: []
      deny: []
    attributes:
      mode: explicit
      include: []
    supplement: engine/sources/supplement/LINE.list
    exclude: []
    note: >-
      v2fly currently provides more precise LINE coverage than the old
      blackmatrix7 list. Broad shared domains must be reviewed rather than
      inherited blindly. nhncorp.jp should remain under review but should not
      be excluded without evidence.

  GitHub:
    enabled: true
    output: Surge/GitHub.list
    views: true
    sources:
      - name: v2fly-domain-list-community
        author: v2fly
        role: primary
        format: v2fly-domain-list
        url: https://raw.githubusercontent.com/v2fly/domain-list-community/master/data/github
    include_policy:
      mode: explicit
      allow:
        - github-copilot
      deny:
        - npmjs
    attributes:
      mode: explicit
      include: []
    supplement: engine/sources/supplement/GitHub.list
    exclude: []
    note: >-
      v2fly is selected because the GitHub dataset is actively maintained and
      includes modern GitHub assets and related services. build.py must resolve
      v2fly include directives deliberately and must not import unrelated npm,
      Microsoft, Amazon, Azure, or other shared infrastructure merely because
      it is reachable through an include.

  SafePal:
    enabled: true
    output: Surge/SafePal.list
    views: true
    sources:
      - name: v2fly-domain-list-community
        author: v2fly
        role: primary
        format: v2fly-domain-list
        url: https://raw.githubusercontent.com/v2fly/domain-list-community/master/data/safepal
    include_policy:
      mode: explicit
      allow: []
      deny: []
    attributes:
      mode: explicit
      include: []
    supplement: engine/sources/supplement/SafePal.list
    exclude: []
    note: >-
      Repcz, SukkaW, blackmatrix7, and MetaCubeX currently have no dedicated
      SafePal dataset. v2fly is selected because its actively maintained,
      narrowly scoped list contains both isafepal.com and safepal.com without
      include directives or attribute-qualified entries.

  PayPal:
    enabled: true
    output: Surge/PayPal.list
    views: true
    sources:
      - name: Repcz-Tool
        author: Repcz
        role: primary
        format: surge-rule-set
        url: https://raw.githubusercontent.com/Repcz/Tool/X/Surge/Rules/PayPal.list
    include_policy:
      mode: explicit
      allow: []
      deny: []
    attributes:
      mode: explicit
      include: []
    supplement: engine/sources/supplement/PayPal.list
    exclude: []
    note: >-
      Repcz is selected by the long-term source preference because its native
      Surge PayPal list currently normalizes to the same output as blackmatrix7.
      It is parsed as a policy-free native Surge source; no supplement is
      justified without a confirmed upstream gap.

  Netflix:
    enabled: true
    output: Surge/Netflix.list
    views: true
    sources:
      - name: blackmatrix7-ios_rule_script
        author: blackmatrix7
        role: primary
        format: surge-rule-set
        url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Netflix/Netflix.list
    include_policy:
      mode: explicit
      allow: []
      deny: []
    attributes:
      mode: explicit
      include: []
    supplement: engine/sources/supplement/Netflix.list
    exclude: []
    note: >-
      blackmatrix7 is selected because its native Surge list retains materially
      broader IPv4 and IPv6 coverage than the smaller domain-oriented v2fly
      dataset. build.py preserves its policy-free IP-CIDR no-resolve semantics;
      no supplement is justified without a confirmed upstream gap.

  YouTube:
    enabled: true
    output: Surge/YouTube.list
    views: true
    sources:
      - name: Repcz-Tool
        author: Repcz
        role: primary
        format: surge-rule-set
        url: https://raw.githubusercontent.com/Repcz/Tool/X/Surge/Rules/YouTube.list
    include_policy:
      mode: explicit
      allow: []
      deny: []
    attributes:
      mode: explicit
      include: []
    supplement: engine/sources/supplement/YouTube.list
    exclude: []
    note: >-
      Repcz is selected because its actively refreshed native Surge list keeps
      a compact set of core YouTube, video, image, API, and country-domain
      coverage. Its focused scope is preferred over larger lists whose extra
      entries do not provide confirmed value for this personal Rule-Set. The
      DOMAIN-SUFFIX,youtube.com entry also covers YouTube TV (tv.youtube.com),
      so no separate YouTube TV app is needed for the friend usage scenario.

  X:
    enabled: true
    output: Surge/X.list
    views: true
    sources:
      - name: Repcz-Tool
        author: Repcz
        role: primary
        format: surge-rule-set
        url: https://raw.githubusercontent.com/Repcz/Tool/X/Surge/Rules/Twitter.list
    include_policy:
      mode: explicit
      allow: []
      deny: []
    attributes:
      mode: explicit
      include: []
    supplement: engine/sources/supplement/X.list
    exclude: []
    note: >-
      Repcz is selected because its native X/Twitter list is actively refreshed,
      includes current X, Twitter, Grok, media, and focused IP coverage, and is
      a strict practical superset of the compared v2fly domain output without
      requiring format conversion.

  Instagram:
    enabled: true
    output: Surge/Instagram.list
    views: true
    sources:
      - name: Repcz-Tool
        author: Repcz
        role: primary
        format: surge-rule-set
        url: https://raw.githubusercontent.com/Repcz/Tool/X/Surge/Rules/Instagram.list
    include_policy:
      mode: explicit
      allow: []
      deny: []
    attributes:
      mode: explicit
      include: []
    supplement: engine/sources/supplement/Instagram.list
    exclude:
      - domain-keyword:instagram
    note: >-
      Repcz is selected for its compact first-party Instagram scope. The native
      DOMAIN-KEYWORD,instagram rule is excluded because it could route unrelated
      third-party domains; the remaining suffix rules cover instagram.com,
      cdninstagram.com, and instagr.am. v2fly is not selected because its larger
      dataset includes many unrelated follower, marketing, typo, and SEO domains.

  Telegram:
    enabled: true
    output: Surge/Telegram.list
    views: true
    sources:
      - name: SukkaW-Surge
        author: SukkaW
        role: primary
        format: surge-rule-set
        url: https://raw.githubusercontent.com/SukkaW/Surge/master/Source/non_ip/telegram.conf
      - name: SukkaW-Surge-Telegram-IP
        author: SukkaW
        role: supplemental
        format: surge-rule-set
        url: https://ruleset.skk.moe/List/ip/telegram.conf
    include_policy:
      mode: explicit
      allow: []
      deny: []
    attributes:
      mode: explicit
      include: []
    supplement: engine/sources/supplement/Telegram.list
    exclude: []
    note: >-
      SukkaW is selected because its actively maintained native Surge source is
      limited to core Telegram domains and fits the preferred source tier. Repcz
      currently includes unsupported IP-ASN rules plus third-party client and
      telemetry scope; v2fly adds TON and related ecosystem domains that are not
      required for a conservative Telegram default. A supplemental IP source
      (ruleset.skk.moe/List/ip/telegram.conf, official Telegram CIDR list, 2026-08-13)
      is added so the canonical set carries both the domain (non-IP) and IP phases,
      enabling Blink to split Telegram into a non-IP view and an IP view for the
      Rule-layer multi-view pilot (2026-08).

  Threads:
    enabled: true
    output: Surge/Threads.list
    views: true
    sources:
      - name: v2fly-domain-list-community
        author: v2fly
        role: primary
        format: v2fly-domain-list
        url: https://raw.githubusercontent.com/v2fly/domain-list-community/master/data/threads
    include_policy:
      mode: explicit
      allow: []
      deny: []
    attributes:
      mode: explicit
      include: []
    supplement: engine/sources/supplement/Threads.list
    exclude: []
    note: >-
      Repcz and SukkaW currently provide no dedicated Threads Rule-Set. v2fly is
      selected because its small data file contains only threads.com and
      threads.net, needs no include expansion, and converts safely to Surge.

  TikTok:
    enabled: true
    output: Surge/TikTok.list
    views: true
    sources:
      - name: Repcz-Tool
        author: Repcz
        role: primary
        format: surge-rule-set
        url: https://raw.githubusercontent.com/Repcz/Tool/X/Surge/Rules/TikTok.list
    include_policy:
      mode: explicit
      allow: []
      deny: []
    attributes:
      mode: explicit
      include: []
    supplement: engine/sources/supplement/TikTok.list
    exclude:
      - ip-asn:*
    note: >-
      Repcz is selected because its native TikTok list is actively refreshed
      and covers TikTok domains, ByteDance CDNs, keywords, and IP ranges more
      completely than every compared candidate. Its two IP-ASN entries are
      dropped through an explicit type-level exclude because build.py v1 does
      not emit ASN rules. blackmatrix7 is stale and drifts into ByteDance AI
      IDE domains; v2fly's TikTok entries all carry negative attributes that
      v1 refuses to interpret.

  Spotify:
    enabled: true
    output: Surge/Spotify.list
    views: true
    sources:
      - name: Repcz-Tool
        author: Repcz
        role: primary
        format: surge-rule-set
        url: https://raw.githubusercontent.com/Repcz/Tool/X/Surge/Rules/Spotify.list
    include_policy:
      mode: explicit
      allow: []
      deny: []
    attributes:
      mode: explicit
      include: []
    supplement: engine/sources/supplement/Spotify.list
    exclude: []
    note: >-
      Repcz is selected because it publishes a compact, actively refreshed,
      native Surge Spotify list that stays entirely inside the build.py v1
      whitelist. SukkaW only embeds Spotify rules inside stream.ts (last
      changed 2025-11) and publishes them merged with other services;
      blackmatrix7 is about 14 months stale, and v2fly would import the
      third-party conductrics.com experiment host.

  AI:
    enabled: true
    output: Surge/AI.list
    views: true
    sources:
      - name: Repcz-Tool
        author: Repcz
        role: primary
        format: surge-rule-set
        url: https://raw.githubusercontent.com/Repcz/Tool/X/Surge/Rules/AI.list
    include_policy:
      mode: explicit
      allow: []
      deny: []
    attributes:
      mode: explicit
      include: []
    supplement: engine/sources/supplement/AI.list
    exclude:
      - url-regex:*
    note: >-
      Repcz AI.list is the aggregated mainstream-AI Rule-Set: it is an actively
      refreshed derivative of SukkaW's ai.conf plus the OpenAI file CDN
      oaiusercontent.com. The single URL-REGEX entry (the google.com/sorry
      Gemini continuation fix that requires MitM of www.google.com) is dropped
      through an explicit type-level exclude because build.py v1 does not emit
      URL-REGEX rules. DeepSeek is intentionally absent (domestic service,
      direct by default); it may only enter via a log-confirmed supplement.

  ZABank:
    enabled: true
    output: Surge/ZABank.list
    views: true
    sources: []
    include_policy:
      mode: explicit
      allow: []
      deny: []
    attributes:
      mode: explicit
      include: []
    supplement: engine/sources/supplement/ZABank.list
    exclude: []
    note: >-
      The 2026-08-15 source audit verified that Repcz, SukkaW, v2fly,
      blackmatrix7, and MetaCubeX provide no ZABank rules, so this app is
      supplement-only: the output is built exclusively from the repo-maintained
      supplement, whose three root domains (za.group, zainvest.group,
      zajourney.com) cover all nine candidate domains recorded from actual
      usage. build.py v1 allows an empty sources list for exactly this case.

  Steam:
    enabled: true
    output: Surge/Steam.list
    views: true
    sources:
      - name: Repcz-Tool
        author: Repcz
        role: primary
        format: surge-rule-set
        url: https://raw.githubusercontent.com/Repcz/Tool/X/Surge/Rules/Steam.list
    include_policy:
      mode: explicit
      allow: []
      deny: []
    attributes:
      mode: explicit
      include: []
    supplement: engine/sources/supplement/Steam.list
    exclude: []
    note: >-
      Repcz is selected because its native, actively refreshed Steam list keeps
      a compact set of core Steam domains (store, community, chat, content,
      steamdeck) without CDN-specific or China-specific hosts, so it builds
      with zero conversion and no type-level excludes. SukkaW has no dedicated
      Steam rules. v2fly's dataset adds legacy regional CDNs and China
      entries; blackmatrix7 is stale and even includes the unrelated
      steamunlocked.net domain.

  APTV:
    enabled: true
    output: Surge/APTV.list
    views: true
    sources: []
    include_policy:
      mode: explicit
      allow: []
      deny: []
    attributes:
      mode: explicit
      include: []
    supplement: engine/sources/supplement/APTV.list
    exclude: []
    note: >-
      APTV (planned as "Live") is a personal live-streaming Rule-Set watched
      through the APTV frontend app. It is supplement-only by design: the rules
      are maintained by the repository owner (originally kept in a private
      list; migrated on 2026-08-15), contain no subscription URLs or tokens,
      and are not upstream-audited. Others reusing this repository should
      evaluate and replace these rules as needed.

  # --- Additional coverage (2026-08-16 source audit) ---

  Disney:
    enabled: true
    output: Surge/Disney.list
    views: true
    sources:
      - name: Repcz-Tool
        author: Repcz
        role: primary
        format: surge-rule-set
        url: https://raw.githubusercontent.com/Repcz/Tool/X/Surge/Rules/Disney.list
    include_policy:
      mode: explicit
      allow: []
      deny: []
    attributes:
      mode: explicit
      include: []
    supplement: engine/sources/supplement/Disney.list
    exclude: []
    note: >-
      Repcz is selected because its actively refreshed native Surge Disney list
      covers Disney+ streaming together with the Disney family brands (ABC,
      ESPN, National Geographic). PROCESS-NAME entries are dropped explicitly
      for Egern/Quantumult X and counted in the build report; the byte-
      identical classical output retains the line, which Loon and Shadowrocket
      simply ignore because the type does not exist there. No supplement is
      justified without a confirmed gap.

  ParamountPlus:
    enabled: true
    output: Surge/ParamountPlus.list
    views: true
    sources:
      - name: blackmatrix7-ios_rule_script
        author: blackmatrix7
        role: primary
        format: surge-rule-set
        url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/ParamountPlus/ParamountPlus.list
    include_policy:
      mode: explicit
      allow: []
      deny: []
    attributes:
      mode: explicit
      include: []
    supplement: engine/sources/supplement/ParamountPlus.list
    exclude: []
    note: >-
      The 2026-08-16 audit found blackmatrix7 to be the only dedicated
      Paramount+ source (Repcz, SukkaW, v2fly, and MetaCubeX have none). Its
      Surge-native list covers paramountplus.com plus CBS streaming hosts and
      a focused USER-AGENT rule. It is about 14 months old, but the domains
      are stable; revisit if usage reveals missing hosts.

  Hulu:
    enabled: true
    output: Surge/Hulu.list
    views: true
    sources:
      - name: blackmatrix7-ios_rule_script
        author: blackmatrix7
        role: primary
        format: surge-rule-set
        url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Hulu/Hulu.list
    include_policy:
      mode: explicit
      allow: []
      deny: []
    attributes:
      mode: explicit
      include: []
    supplement: engine/sources/supplement/Hulu.list
    exclude: []
    note: >-
      blackmatrix7 is selected because its Surge-native Hulu list (US and JP
      scope) is the freshest dedicated source: the v2fly dataset is unchanged
      since 2022 and Repcz/SukkaW publish no standalone Hulu Rule-Set. The
      single PROCESS-NAME entry is dropped explicitly for Egern/Quantumult X
      and counted in the build report; the classical output retains the line
      for Loon/Shadowrocket, which ignore the unsupported type.

  PrimeVideo:
    enabled: true
    output: Surge/PrimeVideo.list
    views: true
    sources:
      - name: Repcz-Tool
        author: Repcz
        role: primary
        format: surge-rule-set
        url: https://raw.githubusercontent.com/Repcz/Tool/X/Surge/Rules/PrimeVideo.list
    include_policy:
      mode: explicit
      allow: []
      deny: []
    attributes:
      mode: explicit
      include: []
    supplement: engine/sources/supplement/PrimeVideo.list
    exclude: []
    note: >-
      Repcz is selected because its actively refreshed native Surge list keeps
      core Prime Video domains plus exact, distribution-specific CloudFront
      and Akamai host entries, so no shared CDN namespace is swallowed.
      blackmatrix7 is older and adds a broader keyword; no supplement is
      justified without a confirmed upstream gap.

  HBO:
    enabled: true
    output: Surge/HBO.list
    views: true
    sources:
      - name: Repcz-Tool
        author: Repcz
        role: primary
        format: surge-rule-set
        url: https://raw.githubusercontent.com/Repcz/Tool/X/Surge/Rules/HBO.list
    include_policy:
      mode: explicit
      allow: []
      deny: []
    attributes:
      mode: explicit
      include: []
    supplement: engine/sources/supplement/HBO.list
    exclude:
      - domain-suffix:execute-api.ap-southeast-1.amazonaws.com
      - domain-suffix:execute-api.us-east-1.amazonaws.com
    note: >-
      Repcz is selected because its actively refreshed native Surge list covers
      the HBO Max brand (hbomax.com and the current max.com) plus HBO-specific
      Akamai and CloudFront hosts. The two generic AWS API Gateway region
      suffixes are excluded explicitly: they would otherwise route unrelated
      AWS services, and the exclusion stays auditable in this manifest.

  Twitch:
    enabled: true
    output: Surge/Twitch.list
    views: true
    sources:
      - name: blackmatrix7-ios_rule_script
        author: blackmatrix7
        role: primary
        format: surge-rule-set
        url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Twitch/Twitch.list
    include_policy:
      mode: explicit
      allow: []
      deny: []
    attributes:
      mode: explicit
      include: []
    supplement: engine/sources/supplement/Twitch.list
    exclude: []
    note: >-
      blackmatrix7 is selected because its Surge-native list combines Twitch
      domains, a keyword, and no-resolve IP ranges (IPv4 and IPv6) into the
      most complete coverage. v2fly is fresher (2026-05) but domain-only, and
      Repcz/SukkaW publish no dedicated Twitch Rule-Set. The PROCESS-NAME
      entry is dropped explicitly for Egern/Quantumult X and counted in the
      build report; the classical output retains the line for Loon/
      Shadowrocket, which ignore the unsupported type.

  Facebook:
    enabled: true
    output: Surge/Facebook.list
    views: true
    sources:
      - name: Repcz-Tool
        author: Repcz
        role: primary
        format: surge-rule-set
        url: https://raw.githubusercontent.com/Repcz/Tool/X/Surge/Rules/Facebook.list
    include_policy:
      mode: explicit
      allow: []
      deny: []
    attributes:
      mode: explicit
      include: []
    supplement: engine/sources/supplement/Facebook.list
    exclude: []
    note: >-
      Repcz is selected because its actively refreshed native Surge list keeps
      the widest current Facebook domain coverage, including the anti-
      typosquatting variants that are community-standard practice (the v2fly
      dataset carries the same kind of entries). No supplement is justified
      without a confirmed upstream gap.

  Google:
    enabled: true
    output: Surge/Google.list
    views: true
    sources:
      - name: Repcz-Tool
        author: Repcz
        role: primary
        format: surge-rule-set
        url: https://raw.githubusercontent.com/Repcz/Tool/X/Surge/Rules/Google.list
    include_policy:
      mode: explicit
      allow: []
      deny: []
    attributes:
      mode: explicit
      include: []
    supplement: engine/sources/supplement/Google.list
    exclude: []
    note: >-
      Repcz is selected because its actively refreshed native Surge list is a
      compact core for Google search and Gmail: DOMAIN-KEYWORD,google covers
      google.com and googleusercontent.com, and DOMAIN-KEYWORD,gmail covers
      gmail.com and googlemail.com. Unlike the Instagram keyword case, the
      google keyword is retained deliberately because it is the backbone of
      coverage and real third-party collisions are negligible. Its youtube.com
      entries deduplicate against the YouTube Rule-Set.

  NBA:
    enabled: true
    output: Surge/NBA.list
    views: true
    sources: []
    include_policy:
      mode: explicit
      allow: []
      deny: []
    attributes:
      mode: explicit
      include: []
    supplement: engine/sources/supplement/NBA.list
    exclude: []
    note: >-
      The 2026-08-16 audit found no NBA rules in Repcz, SukkaW, blackmatrix7,
      v2fly, MetaCubeX, or RuleGo, so this app is supplement-only: two root
      domains (nba.com, nba.net) cover the official site and the NBA app
      (api/cdn/stats subdomains live under nba.com).
      It stays supplement-only unless usage reveals missing hosts.

  Suno:
    enabled: true
    output: Surge/Suno.list
    views: true
    sources: []
    include_policy:
      mode: explicit
      allow: []
      deny: []
    attributes:
      mode: explicit
      include: []
    supplement: engine/sources/supplement/Suno.list
    exclude: []
    note: >-
      The 2026-08-16 audit found no Suno rules in any audited source, so this
      app is supplement-only: two root domains (suno.com, suno.ai) cover the
      web app, mobile app, and studio API.
      It stays supplement-only unless usage reveals missing hosts.

  Starryblu:
    enabled: true
    output: Surge/Starryblu.list
    views: true
    sources: []
    include_policy:
      mode: explicit
      allow: []
      deny: []
    attributes:
      mode: explicit
      include: []
    supplement: engine/sources/supplement/Starryblu.list
    exclude: []
    note: >-
      Starryblu is a global payment app (starryblu.com, Singapore FinTech
      exhibitor, App Store id 6736854716). The 2026-08-26 audit probed Repcz
      (Surge/Rules/Starryblu.list), SukkaW (Source/non_ip/starryblu.conf),
      v2fly (data/starryblu), and blackmatrix7 (rule/Surge/Starryblu) — all
      404, no dedicated upstream, so this app is supplement-only: the root
      domain starryblu.com covers the official site and app API subdomains.
      It stays supplement-only unless usage reveals missing hosts.

  AWSConsole:
    enabled: true
    output: Surge/AWSConsole.list
    views: true
    sources:
      - name: v2fly-domain-list-community
        author: v2fly
        role: primary
        format: v2fly-domain-list
        url: https://raw.githubusercontent.com/v2fly/domain-list-community/master/data/aws
    include_policy:
      mode: explicit
      allow: []
      deny: ["aws-cn"]
    attributes:
      mode: explicit
      include: []
    supplement: engine/sources/supplement/AWSConsole.list
    exclude:
      - regexp:*
      - domain-suffix:cloudfront.com
      - domain-suffix:cloudfront.net
    note: >-
      Source audit (2026-09-01): SukkaW, Repcz, and blackmatrix7 publish no
      dedicated AWS Rule-Set, so v2fly data/aws is the only dedicated upstream
      whose AWS domain set covers the AWS Console app (aws.amazon.com,
      console.aws.amazon.com, signin/auth hosts, awsapps.com, awsstatic.com).
      The single awsdns regexp entry is dropped via an explicit type-level
      exclude (v1 does not emit regexp rules), and the aws-cn include is
      denied explicitly (AWS China resolves domestically). The shared CDN
      namespaces cloudfront.com / cloudfront.net are excluded as concrete
      domain-suffix entries to avoid swallowing generic AWS CDN hosts.
