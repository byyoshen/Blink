# ============================================================
# Blink 配置文件 · Loon
# 导入前在 App 内添加你的订阅节点；地区组通过 [Remote Filter] 正则筛选全部节点。
# 策略组与规则引用由 Blink 统一维护；本文件为人工维护层，不随规则每日自动更新。
# 公开模板只保留核心策略组与 App 规则，其余个性化场景请按需自行扩展。
# ADAPTED：App 内添加订阅（未映射自动拉取）。
# ADAPTED：no-resolve —— Loon 的 [Remote Rule] 引用行没有 no-resolve 槽位，只有规则集
#   文件内的规则行能携带该选项。Blink 自产的 -ip.conf 每行都带 no-resolve，因此 App 的
#   IP 段受保护；外部 IP 规则集（china_ip）行内不带该选项，无法在引用处补上，走到该段的
#   域名会被本地解析。需要严格 no-resolve 时请改用行内带 no-resolve 的上游 IP 规则集。
# UNSUPPORTED：extended-matching / pre-matching / DOMAIN-SET / always-real-ip /
#   always-raw-tcp-hosts / proxy-test-udp / http-api 为 Surge 专属，本文件省略或按需在 App 内配置。
# ============================================================

