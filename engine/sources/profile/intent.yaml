# Blink Canonical Profile Intent —— 配置文件层唯一语义源（人工维护，绝不进入 update.yml）。
#
# 规则层（Rule Engine / build.py）与 Profile 层彻底分离：规则每日自动更新，Profile 人工演进。
# 本文件描述「配置意图」，由 engine/scripts/build_profile.py 渲染为七客户端 Profiles/。
#
# 普适性原则：
#   - 单一订阅池 Sub（占位 URL），替换一条订阅即可复用。
#   - 不含任何个人专属内容（双订阅池、个人域名、银行域名等保留在作者本地配置，不进入公开产物）。
#   - 公开模板策略组与 App 规则只保留核心；其余交由用户按需自行扩展，并在生成文件头部提示。
#
# 能力约定（Surge 强绑定能力跨端一律 FULL / ADAPTED(注释) / UNSUPPORTED(注释)，禁止静默省略或伪造）：
#   extended-matching / pre-matching / DOMAIN-SET / REJECT-DROP 为 Surge 专属或强绑定；
#   no-resolve 为 Surge/Shadowrocket/Loon/Stash/Mihomo 支持（QX 无槽位省略、Egern set 级）。

version: 1

subscription:
  name: Sub
  url: "https://YOUR-SUBSCRIPTION-URL"
  update_interval: 86400  # 秒；各客户端映射到自己的更新周期字段

policy_groups:
  # ---- 出口骨架：地区组 + Auto（核心分流基础设施，非场景组）----
  - name: HK
    type: select
    filter: '(?i)(香港|🇭🇰|Hong\s*Kong|HongKong|HKG|(?:^|[^A-Za-z])HK(?:G)?(?:[^A-Za-z]|$))'

  - name: TW
    type: select
    filter: '(?i)(台湾|台灣|🇹🇼|Taiwan|Taipei|TWN|(?:^|[^A-Za-z])TW(?:N)?(?:[^A-Za-z]|$))'

  - name: JP
    type: select
    filter: '(?i)(日本|🇯🇵|Japan|Tokyo|Osaka|Sakura|SoftBank|JPN|(?:^|[^A-Za-z])JP(?:N)?(?:[^A-Za-z]|$))'

  - name: US
    type: select
    filter: '(?i)(美国|美國|🇺🇸|United\s*States|America|USA|US\s*Premium|(?:^|[^A-Za-z])US(?:A)?(?:[^A-Za-z]|$))'

  - name: SG
    type: select
    filter: '(?i)(新加坡|狮城|獅城|🇸🇬|Singapore|SGP|SGGS|(?:^|[^A-Za-z])SG(?:P)?(?:[^A-Za-z]|$))'

  - name: Auto
    type: url-test
    members: [HK, TW, JP, US, SG]
    interval: 600
    tolerance: 80
    hidden: true

  # ---- 主 / 兜底 ----
  - name: Proxy
    type: select
    members: [HK, TW, JP, US, SG, Final]

  - name: Final
    type: select
    members: [HK, TW, JP, US, SG, Auto, Sub, DIRECT]

  # ---- App 场景组（公开模板只保留普遍常用；成员统一 select, Proxy, Final, DIRECT）----
  - name: Telegram
    type: select
    members: [Proxy, Final, DIRECT]

  - name: X
    type: select
    members: [Proxy, Final, DIRECT]

  - name: Youtube
    type: select
    members: [Proxy, Final, DIRECT]

  - name: Instagram
    type: select
    members: [Proxy, Final, DIRECT]

  - name: Google
    type: select
    members: [Proxy, Final, DIRECT]

  - name: Github
    type: select
    members: [Proxy, Final, DIRECT]

# App → 策略组 路由意图（公开模板只保留 6 个；其余按需自行添加对应策略组）。
# 默认 source 为 Blink 已发布 URL；mihomo 走 mihomo/ 目录（已去 USER-AGENT）。
# views: [domainset|nonip|ip] 表示该 App 用分文件引用（需对应 Rule 层已产出 view 文件）；
# 空/省略则用单一 .list 混合引用。
apps:
  Telegram:  {policy: Telegram, views: [domainset, ip]}
  X:         {policy: X, views: [domainset, ip]}
  YouTube:   {policy: Youtube, views: [nonip]}
  Instagram: {policy: Instagram, views: [domainset]}
  Google:    {policy: Google, views: [nonip, ip]}
  GitHub:    {policy: Github, views: [domainset]}

# 基础设施规则 = 普适核心（沿用成熟上游，不复制进仓库）。
# policy 缺省表示七端一致；options / surge_options / qx_url / clients 为客户端专属。
infrastructure:
  # ---- Reject（Ad block / 隐私拦截）----
  # pre-matching + REJECT-DROP 为 Surge 专属，其余端 UNSUPPORTED（切片 3 细化标注）。
  - name: reject-drop
    url: https://ruleset.skk.moe/List/non_ip/reject-drop.conf
    policy: REJECT-DROP
    clients: [surge]
    surge_options: [pre-matching]

  # DOMAIN-SET（纯域名文件）仅 Surge 用 DOMAIN-SET 引用；其余端 UNSUPPORTED。
  - name: reject-domainset
    url: https://ruleset.skk.moe/List/domainset/reject.conf
    policy: REJECT
    kind: domain-set
    clients: [surge]
    surge_options: [extended-matching]

  - name: reject
    url: https://ruleset.skk.moe/List/non_ip/reject.conf
    policy: REJECT
    surge_options: [extended-matching]
    qx_url: https://raw.githubusercontent.com/Repcz/Tool/X/QuantumultX/Rules/Reject.list

  - name: tracking
    url: https://raw.githubusercontent.com/ConnersHua/RuleGo/master/Surge/Ruleset/Extra/Reject/Tracking.list
    policy: REJECT
    clients: [surge, shadowrocket, loon, stash, egern, mihomo]
    surge_options: [extended-matching]

  # ---- Infrastructure ----
  - name: ntp-123
    kind: dest-port
    value: "123"
    policy: DIRECT
    clients: [surge, shadowrocket, loon, mihomo]

  - name: lan
    url: https://ruleset.skk.moe/List/non_ip/lan.conf
    policy: DIRECT
    qx_url: https://raw.githubusercontent.com/Repcz/Tool/X/QuantumultX/Rules/Lan.list

  # ---- Domestic（国内直连）----
  - name: domestic
    url: https://ruleset.skk.moe/List/non_ip/domestic.conf
    policy: DIRECT
    qx_url: https://raw.githubusercontent.com/Repcz/Tool/X/QuantumultX/Rules/ChinaDomain.list

  # ---- CDN（公共静态资源走代理；不与 App 专项规则抢）----
  - name: cdn
    url: https://ruleset.skk.moe/List/non_ip/cdn.conf
    policy: Proxy
    qx_url: https://raw.githubusercontent.com/Repcz/Tool/X/QuantumultX/Rules/CDN.list

  # ---- IP（no-resolve；置于所有域名规则之后）----
  # 这两个上游 IP 规则集的行内不带 no-resolve（skk 的约定是在引用处指定），
  # 所以引用行上的 no-resolve 是这里唯一的 DNS 防护点：缺失即意味着走到 IP
  # 段的域名会被本地提前解析。凡引用行有 no-resolve 槽位的客户端都必须声明。
  - name: china-ip
    url: https://ruleset.skk.moe/List/ip/domestic.conf
    policy: DIRECT
    phase: ip
    options: {surge: no-resolve, shadowrocket: no-resolve, stash: no-resolve, mihomo: no-resolve}
    qx_url: https://raw.githubusercontent.com/Repcz/Tool/X/QuantumultX/Rules/ChinaIP.list

  - name: china-ip2
    url: https://ruleset.skk.moe/List/ip/china_ip.conf
    policy: DIRECT
    phase: ip
    clients: [surge, shadowrocket, loon, stash, egern, mihomo]
    options: {surge: no-resolve, shadowrocket: no-resolve, stash: no-resolve, mihomo: no-resolve}
